name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CCACHE_ENABLE: '1'
  CCACHE_SLOPPINESS: 'pch_defines,time_macros,include_file_mtime,include_file_ctime'
  CCACHE_COMPRESS: 'true'

jobs:
  # ============================================================================
  # Windows 单元测试套件 (Pure-GDI Release)
  # ============================================================================
  test-windows:
    name: Tests (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-test-win-x64
          max-size: 300M

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Locate Clang-CL / LLD / Ninja
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $llvmBin = Join-Path $vsPath "VC\Tools\Llvm\x64\bin"
          $ninjaBin = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
          "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$ninjaBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_BIN=$($llvmBin -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure & Build Tests (Windows Pure-GDI Release)
        shell: pwsh
        run: |
          cmake -B build-ci-win -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            -DKERNETILE_WINDOWS_PURE_GDI=ON `
            -DCMAKE_CXX_COMPILER="${env:LLVM_BIN}/clang-cl.exe" `
            -DCMAKE_LINKER="${env:LLVM_BIN}/lld-link.exe" `
            -DCMAKE_AR="${env:LLVM_BIN}/llvm-lib.exe"
          cmake --build build-ci-win --parallel

      - name: Run CTest Suite (Windows)
        shell: pwsh
        run: |
          ctest --test-dir build-ci-win --output-on-failure

  # ============================================================================
  # Linux 单元测试套件 & SDK 冒烟编译 (Ubuntu 22.04 Clang)
  # ============================================================================
  test-linux:
    name: Tests (Linux x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-test-linux-x64
          max-size: 300M

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 cmake ninja-build clang lld pkg-config \
            libpango1.0-dev libcairo2-dev libx11-dev libxi-dev \
            libvulkan-dev glslang-tools fonts-liberation

      - name: Configure & Build Tests (Linux Release)
        run: |
          cmake -B build-ci-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-ci-linux --parallel

      - name: Run CTest Suite (Linux)
        run: |
          ctest --test-dir build-ci-linux --output-on-failure

      - name: Smoke-Test Single-File SDK (Linux hpp/cpp)
        run: |
          python3 scripts/amalgamate.py --out dist/amalgamation
          cd dist/amalgamation
          clang++ -std=c++20 -O2 -DNDEBUG -fno-exceptions -fno-rtti \
            example_hello.cpp kernetile.cpp \
            $(pkg-config --cflags --libs pangocairo pango cairo) \
            -lX11 -lXi -lpthread -lm -ldl -o smoke_linux
          ls -lh smoke_linux

name: Deploy Web to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CCACHE_ENABLE: '1'
  CCACHE_SLOPPINESS: 'pch_defines,time_macros,include_file_mtime,include_file_ctime'
  CCACHE_COMPRESS: 'true'

jobs:
  deploy:
    name: Deploy Web to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Setup Emscripten SDK 3.1.56
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: web-wasm
          max-size: 300M

      - name: Build KTUI Gallery WebAssembly
        run: |
          emcmake cmake -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DBUILD_TESTING=OFF
          cmake --build build-web --target ktui_gallery

      - name: Prepare GitHub Pages Distribution
        run: |
          mkdir -p dist
          cp build-web/ktui_gallery.html dist/index.html
          cp build-web/ktui_gallery.js dist/ktui_gallery.js
          cp build-web/ktui_gallery.wasm dist/ktui_gallery.wasm
          sed -i "s|__KTUI_ASSET_VER__|${{ github.sha }}|g" dist/index.html
          touch dist/.nojekyll
          ls -lh dist

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

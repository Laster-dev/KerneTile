name: Deploy WebAssembly Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Verify Emscripten
        run: |
          emcc -v

      - name: Configure CMake for Web
        run: |
          emcmake cmake -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20

      - name: Build KTUI Gallery WebAssembly
        run: |
          cmake --build build-web --target ktui_gallery

      - name: Prepare GitHub Pages Distribution
        run: |
          mkdir -p dist
          cp build-web/ktui_gallery.html dist/index.html
          cp build-web/ktui_gallery.js dist/ktui_gallery.js
          cp build-web/ktui_gallery.wasm dist/ktui_gallery.wasm
          cp examples/ktui_gallery/wallpaper_dark.jpg dist/wallpaper_dark.jpg
          # 为 JS/WASM/壁纸资源注入提交哈希版本号，防止浏览器混用新版 index.html 与旧缓存
          sed -i "s|ktui_gallery\.js|ktui_gallery.js?v=${{ github.sha }}|g" dist/index.html
          sed -i "s|__KTUI_ASSET_VER__|${{ github.sha }}|g" dist/index.html
          sed -i "s|wallpaper_dark\.jpg|wallpaper_dark.jpg?v=${{ github.sha }}|g" dist/index.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

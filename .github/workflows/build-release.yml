name: Build Multi-Platform Minimal Binaries (Windows / Linux / Android)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CCACHE_ENABLE: '1'
  CCACHE_SLOPPINESS: 'pch_defines,time_macros,include_file_mtime,include_file_ctime'
  CCACHE_COMPRESS: 'true'

jobs:
  # ============================================================================
  # Windows: x64 / x86 / arm64 (Clang-CL -Oz -flto=thin + lld-link + Hybrid CRT)
  # ============================================================================
  build-windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vcvars: amd64
            target: x86_64-pc-windows-msvc
            cmake_proc: AMD64
          - arch: x86
            vcvars: amd64_x86
            target: i686-pc-windows-msvc
            cmake_proc: x86
          - arch: arm64
            vcvars: amd64_arm64
            target: aarch64-pc-windows-msvc
            cmake_proc: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ccache (Incremental C++ Cache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: win-${{ matrix.arch }}
          max-size: 300M

      - name: Setup MSVC Developer Environment (${{ matrix.vcvars }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vcvars }}

      - name: Locate Clang-CL / LLD / Ninja
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $llvmBin = Join-Path $vsPath "VC\Tools\Llvm\x64\bin"
          $ninjaBin = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
          if (-not (Test-Path (Join-Path $llvmBin "clang-cl.exe"))) {
            throw "clang-cl.exe not found in $llvmBin"
          }
          "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$ninjaBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_BIN=$($llvmBin -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake (Windows ${{ matrix.arch }} Clang-CL -Oz ThinLTO)
        shell: pwsh
        run: |
          cmake -B build-win-${{ matrix.arch }} -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_proc }} `
            -DCMAKE_CXX_COMPILER="${env:LLVM_BIN}/clang-cl.exe" `
            -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} `
            -DCMAKE_LINKER="${env:LLVM_BIN}/lld-link.exe" `
            -DCMAKE_AR="${env:LLVM_BIN}/llvm-lib.exe" `
            -DCMAKE_CXX_FLAGS="--target=${{ matrix.target }}"

      - name: Build ktui_gallery (Windows ${{ matrix.arch }})
        shell: pwsh
        run: |
          cmake --build build-win-${{ matrix.arch }} --target ktui_gallery
          New-Item -ItemType Directory -Force -Path dist/windows-${{ matrix.arch }} | Out-Null
          Copy-Item build-win-${{ matrix.arch }}/ktui_gallery.exe dist/windows-${{ matrix.arch }}/ktui_gallery-windows-${{ matrix.arch }}.exe
          Get-Item dist/windows-${{ matrix.arch }}/* | Select-Object Name, Length

      - name: Upload Artifact (Windows ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ktui_gallery-windows-${{ matrix.arch }}
          path: dist/windows-${{ matrix.arch }}/ktui_gallery-windows-${{ matrix.arch }}.exe

  # ============================================================================
  # Linux Native: x64 (x86_64) & arm64 (aarch64)
  #   使用 ubuntu-22.04 (glibc 2.35，兼容 Debian 12 / Ubuntu 22.04+ / Arch / Fedora)
  #   原生 Clang + LLD (-Oz -flto=thin -Wl,--icf=all -Wl,--strip-all) 实现最小体积 (~750 KB)
  # ============================================================================
  build-linux-native:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ccache (Incremental C++ Cache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-clang22-${{ matrix.arch }}
          max-size: 300M

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld pkg-config \
            libpango1.0-dev libcairo2-dev libx11-dev libxi-dev \
            libvulkan-dev glslang-tools

      - name: Configure & Build (Linux ${{ matrix.arch }} Clang -Oz ThinLTO + LLD ICF)
        run: |
          cmake -B build-linux-${{ matrix.arch }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-linux-${{ matrix.arch }} --target ktui_gallery
          mkdir -p dist/linux-${{ matrix.arch }}
          cp build-linux-${{ matrix.arch }}/ktui_gallery dist/linux-${{ matrix.arch }}/ktui_gallery-linux-${{ matrix.arch }}
          chmod +x dist/linux-${{ matrix.arch }}/ktui_gallery-linux-${{ matrix.arch }}
          ls -lh dist/linux-${{ matrix.arch }}/
          echo "Required GLIBC versions:"
          objdump -T dist/linux-${{ matrix.arch }}/ktui_gallery-linux-${{ matrix.arch }} | grep -oE 'GLIBC_[0-9.]+' | sort -uV || true

      - name: Upload Artifact (Linux ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ktui_gallery-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}/ktui_gallery-linux-${{ matrix.arch }}

  # ============================================================================
  # Android: 按 ABI 拆分为 2 个独立最小体积 APK
  #   - arm64-v8a   (64位 ARM / ARMv8，主流安卓手机)
  #   - armeabi-v7a (32位 ARM / ARMv7，老款安卓设备)
  # ============================================================================
  build-android:
    name: Android (ARM64 & ARMv7 APKs)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup ccache (Incremental Android NDK C++ Cache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm-abis
          max-size: 300M

      - name: Install Android CMake 3.22.1 & SDK 34
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode Release Keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "${{ github.workspace }}/android/app/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=${{ github.workspace }}/android/app/release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore decoded successfully."
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; falling back to debug keystore."
          fi

      - name: Build Per-ABI Release APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ github.ref_name }}

      - name: Collect & Inspect Per-ABI APKs
        run: |
          mkdir -p dist/android
          for abi in arm64-v8a armeabi-v7a; do
            src="android/app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ ! -f "$src" ]; then
              echo "Missing expected ABI APK: $src"
              ls -la android/app/build/outputs/apk/release/
              exit 1
            fi
            cp "$src" "dist/android/ktui_gallery-android-${abi}.apk"
          done
          ls -lh dist/android/

      - name: Upload Android arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: ktui_gallery-android-arm64-v8a
          path: dist/android/ktui_gallery-android-arm64-v8a.apk

      - name: Upload Android armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: ktui_gallery-android-armeabi-v7a
          path: dist/android/ktui_gallery-android-armeabi-v7a.apk

  # ============================================================================
  # Web (WebAssembly): 打包为单一离线的 ktui_gallery-web.html（内置 JS + WASM + 壁纸）
  # ============================================================================
  build-web:
    name: Web (Single-File WASM HTML)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Setup Emscripten SDK 3.1.56
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Setup ccache (Incremental WASM Cache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: web-wasm
          max-size: 300M

      - name: Configure & Build WebAssembly
        run: |
          emcmake cmake -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DBUILD_TESTING=OFF
          cmake --build build-web --target ktui_gallery
          python3 scripts/bundle_single_html.py build-web dist/web/ktui_gallery-web.html
          ls -lh build-web/ktui_gallery.wasm build-web/ktui_gallery.js dist/web/ktui_gallery-web.html

      - name: Upload Artifact (Web Single-File HTML)
        uses: actions/upload-artifact@v4
        with:
          name: ktui_gallery-web
          path: dist/web/ktui_gallery-web.html

  # ============================================================================
  # 自动发布到 GitHub Release：
  #   - 推送 v* Tag：发布正式版本 Release
  #   - 推送 main 分支 / 手动触发：自动更新 rolling 的 `latest` Release
  # ============================================================================
  release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: [build-windows, build-linux-native, build-android, build-web]
    runs-on: ubuntu-24.04
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Versioned Release (v* Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

      - name: Update Rolling Latest Release (main)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (main)
          body: "自动构建于提交 `${{ github.sha }}`，包含 Windows (`x64`/`x86`/`arm64`)、Linux (`x64`/`arm64`, glibc 2.28)、Android 独立分包 (`arm64-v8a`/`armeabi-v7a`) 与 Web 单文件 (`ktui_gallery-web.html`) 最小体积产物。"
          prerelease: true
          make_latest: false
          files: release-assets/*

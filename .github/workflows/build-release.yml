name: Release (Gallery & SDK)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CCACHE_ENABLE: '1'
  CCACHE_SLOPPINESS: 'pch_defines,time_macros,include_file_mtime,include_file_ctime'
  CCACHE_COMPRESS: 'true'

jobs:
  # ============================================================================
  # Windows Gallery: x64 / x86 / arm64 (D3D12 + Pure GDI, Clang-CL -Oz + Hybrid CRT)
  # ============================================================================
  build-windows:
    name: Gallery Windows (x64 / x86 / arm64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: win-gallery
          max-size: 600M

      - name: Build Windows Galleries (x64, x86, arm64)
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $vcvarsall = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          $llvmBin = ($vsPath + "\VC\Tools\Llvm\x64\bin") -replace '\\','/'
          $ninjaBin = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
          if (-not (Test-Path "$llvmBin/clang-cl.exe")) {
            throw "clang-cl.exe not found in $llvmBin"
          }
          $env:PATH = "$($llvmBin -replace '/','\');$ninjaBin;$env:PATH"

          $targets = @(
            @{ arch = 'x64';   vcvars = 'amd64';       target = 'x86_64-pc-windows-msvc';  proc = 'AMD64' },
            @{ arch = 'x86';   vcvars = 'amd64_x86';   target = 'i686-pc-windows-msvc';    proc = 'x86'   },
            @{ arch = 'arm64'; vcvars = 'amd64_arm64'; target = 'aarch64-pc-windows-msvc'; proc = 'ARM64' }
          )

          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          foreach ($t in $targets) {
            $arch = $t.arch
            Write-Host "=== Building Windows $arch (D3D12 + Pure GDI) ==="
            $cmd = @(
              "call `"$vcvarsall`" $($t.vcvars)",
              "cmake -B build-win-$arch -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_SYSTEM_PROCESSOR=$($t.proc) -DCMAKE_CXX_COMPILER=`"$llvmBin/clang-cl.exe`" -DCMAKE_CXX_COMPILER_TARGET=$($t.target) -DCMAKE_LINKER=`"$llvmBin/lld-link.exe`" -DCMAKE_AR=`"$llvmBin/llvm-lib.exe`" -DCMAKE_CXX_FLAGS=`"--target=$($t.target)`"",
              "cmake --build build-win-$arch --target ktui_gallery",
              "cmake -B build-win-$arch-gdi -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DKERNETILE_WINDOWS_PURE_GDI=ON -DCMAKE_SYSTEM_PROCESSOR=$($t.proc) -DCMAKE_CXX_COMPILER=`"$llvmBin/clang-cl.exe`" -DCMAKE_CXX_COMPILER_TARGET=$($t.target) -DCMAKE_LINKER=`"$llvmBin/lld-link.exe`" -DCMAKE_AR=`"$llvmBin/llvm-lib.exe`" -DCMAKE_CXX_FLAGS=`"--target=$($t.target)`"",
              "cmake --build build-win-$arch-gdi --target ktui_gallery"
            ) -join " && "
            cmd /c $cmd
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Copy-Item "build-win-$arch/ktui_gallery.exe" "dist/windows/ktui_gallery-windows-$arch.exe"
            Copy-Item "build-win-$arch-gdi/ktui_gallery.exe" "dist/windows/ktui_gallery-windows-$arch-gdi.exe"
          }
          Get-Item dist/windows/* | Select-Object Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktui_gallery-windows
          path: dist/windows/*

  # ============================================================================
  # Linux Gallery: x64 & arm64 (Clang -Oz ThinLTO + LLD ICF)
  # ============================================================================
  build-linux-native:
    name: Gallery Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-clang22-${{ matrix.arch }}
          max-size: 300M

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang lld pkg-config \
            libpango1.0-dev libcairo2-dev libx11-dev libxi-dev \
            libvulkan-dev glslang-tools

      - name: Configure & Build (Linux ${{ matrix.arch }})
        run: |
          cmake -B build-linux-${{ matrix.arch }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-linux-${{ matrix.arch }} --target ktui_gallery
          mkdir -p dist/linux-${{ matrix.arch }}
          cp build-linux-${{ matrix.arch }}/ktui_gallery dist/linux-${{ matrix.arch }}/ktui_gallery-linux-${{ matrix.arch }}
          chmod +x dist/linux-${{ matrix.arch }}/ktui_gallery-linux-${{ matrix.arch }}
          ls -lh dist/linux-${{ matrix.arch }}/

      - name: Upload Artifact (Linux ${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ktui_gallery-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}/ktui_gallery-linux-${{ matrix.arch }}

  # ============================================================================
  # Android Gallery: arm64-v8a & armeabi-v7a APKs
  # ============================================================================
  build-android:
    name: Gallery Android (ARM64 & ARMv7)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm-abis
          max-size: 300M

      - name: Install Android CMake 3.22.1 & SDK 34
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode Release Keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "${{ github.workspace }}/android/app/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=${{ github.workspace }}/android/app/release.keystore" >> "$GITHUB_ENV"
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; falling back to debug keystore."
          fi

      - name: Build Per-ABI Release APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ github.ref_name }}

      - name: Collect Per-ABI APKs
        run: |
          mkdir -p dist/android
          for abi in arm64-v8a armeabi-v7a; do
            src="android/app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ ! -f "$src" ]; then
              echo "Missing expected ABI APK: $src"
              exit 1
            fi
            cp "$src" "dist/android/ktui_gallery-android-${abi}.apk"
          done
          ls -lh dist/android/

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: ktui_gallery-android
          path: dist/android/*.apk

  # ============================================================================
  # Web Gallery (WebAssembly Single-File HTML)
  # ============================================================================
  build-web:
    name: Gallery Web (Single-File HTML)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Setup Emscripten SDK 3.1.56
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: web-wasm
          max-size: 300M

      - name: Configure & Build WebAssembly
        run: |
          emcmake cmake -B build-web -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DBUILD_TESTING=OFF
          cmake --build build-web --target ktui_gallery
          python3 scripts/bundle_single_html.py build-web dist/web/ktui_gallery-web.html
          ls -lh build-web/ktui_gallery.wasm build-web/ktui_gallery.js dist/web/ktui_gallery-web.html

      - name: Upload Artifact (Web Single-File HTML)
        uses: actions/upload-artifact@v4
        with:
          name: ktui_gallery-web
          path: dist/web/ktui_gallery-web.html

  # ============================================================================
  # Single-File SDK: kernetile.ixx + kernetile-hpp-cpp.zip
  # ============================================================================
  build-amalgamation:
    name: Single-File SDK (ixx & hpp/cpp.zip)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment (amd64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Generate & Smoke-Test Single-File SDK
        shell: pwsh
        run: |
          python scripts/amalgamate.py --out dist/amalgamation
          Push-Location dist/amalgamation
          cl /nologo /std:c++20 /O2 /utf-8 /EHsc example_hello.cpp kernetile.cpp /Fe:hello_d3d12.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++20 /O2 /utf-8 /EHsc /DKERNETILE_PURE_GDI=1 example_hello.cpp kernetile.cpp /Fe:hello_gdi.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++20 /O2 /utf-8 /EHsc /interface /c kernetile.ixx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++20 /O2 /utf-8 /EHsc example_module.cpp kernetile.obj /Fe:hello_mod.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++20 /O2 /utf-8 /EHsc /DKERNETILE_PURE_GDI=1 /interface /c kernetile.ixx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++20 /O2 /utf-8 /EHsc example_module.cpp kernetile.obj /Fe:hello_mod_gdi.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item *.obj, *.exe, *.ifc -Force
          Pop-Location

      - name: Package kernetile.ixx & kernetile-hpp-cpp.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release-amalg | Out-Null
          Copy-Item dist/amalgamation/kernetile.ixx dist/release-amalg/kernetile.ixx
          Compress-Archive -Path `
            dist/amalgamation/kernetile.hpp, `
            dist/amalgamation/kernetile.cpp, `
            dist/amalgamation/example_hello.cpp, `
            dist/amalgamation/README.md `
            -DestinationPath dist/release-amalg/kernetile-hpp-cpp.zip -Force
          Get-Item dist/release-amalg/* | Select-Object Name, Length

      - name: Upload Artifact (Single-File SDK)
        uses: actions/upload-artifact@v4
        with:
          name: kernetile-sdk
          path: dist/release-amalg/*

  # ============================================================================
  # Publish GitHub Release (v* tag -> versioned release; main -> rolling latest)
  # ============================================================================
  release:
    name: Publish Release
    needs: [build-windows, build-linux-native, build-android, build-web, build-amalgamation]
    runs-on: ubuntu-24.04
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Versioned Release (v* Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

      - name: Update Rolling Latest Release (main)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (main)
          body: "自动构建于提交 `${{ github.sha }}`，包含独立 C++20 模块 (`kernetile.ixx`)、双文件压缩包 (`kernetile-hpp-cpp.zip`: `kernetile.hpp` + `kernetile.cpp`)，以及 Windows (`x64`/`x86`/`arm64` D3D12 与 Pure-GDI)、Linux (`x64`/`arm64`)、Android (`arm64-v8a`/`armeabi-v7a`) 和 Web 单文件 (`ktui_gallery-web.html`) Gallery 产物。"
          prerelease: true
          make_latest: false
          files: release-assets/*

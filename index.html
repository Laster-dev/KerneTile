<!doctypehtml><html lang=zh-CN><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"name=viewport><title>KerneTile Studio (KTUI Web)</title><style>:root{--bg-color:#121214;--panel-bg:#1c1c20;--border-color:#2e2e34;--accent-color:#2b7fff;--text-primary:#f0f0f2;--text-secondary:#909098}*{box-sizing:border-box;user-select:none;-webkit-user-select:none}body{margin:0;padding:0;background-color:var(--bg-color);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow-x:hidden}.container{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px}.header{text-align:center}.title{font-size:22px;font-weight:600;letter-spacing:.5px;margin:0 0 6px 0;color:var(--text-primary);display:flex;align-items:center;justify-content:center;gap:10px}.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:rgba(43,127,255,.2);color:var(--accent-color);border:1px solid rgba(43,127,255,.4);text-transform:uppercase}.subtitle{font-size:13px;color:var(--text-secondary);margin:0}.canvas-wrapper{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.6),0 0 0 1px var(--border-color);background-color:#1a1a1d}#canvas{display:block;outline:0;cursor:default}.status-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary)}.status-dot{width:8px;height:8px;border-radius:50%;background-color:#4caf50;box-shadow:0 0 8px rgba(76,175,80,.6)}.status-dot.loading{background-color:#ff9800;box-shadow:0 0 8px rgba(255,152,0,.6);animation:pulse 1s infinite alternate}@keyframes pulse{from{opacity:.4}to{opacity:1}}.footer-tips{font-size:12px;color:var(--text-secondary);text-align:center;max-width:480px;line-height:1.5}</style></head><body><div class=container><div class=header><h1 class=title>KerneTile Studio <span class=badge>WebAssembly</span></h1><p class=subtitle>跨平台现代 C++20 声明式 UI 框架 · Web 实时光栅化演示</p></div><div class=canvas-wrapper><canvas height=310 id=canvas tabindex=0 width=480></canvas></div><div class=status-bar><span class="loading status-dot"id=status-dot></span> <span id=status-text>正在加载 WebAssembly 模块...</span></div><div class=footer-tips>💡 提示：本演示运行于纯 WebAssembly 沙盒。支持鼠标悬停、点击动效、焦点导航、双向数据绑定以及原生文本与中英文输入法。</div></div><script>var statusDot=document.getElementById("status-dot"),statusText=document.getElementById("status-text"),Module={preRun:[],postRun:[function(){statusDot&&(statusDot.className="status-dot"),statusText&&(statusText.textContent="运行中 (60 FPS 响应式事件循环已就绪)");var t=document.getElementById("canvas");t&&t.focus()}],print:function(t){console.log("[KerneTile Wasm stdout]",t)},printErr:function(t){console.error("[KerneTile Wasm stderr]",t),t&&(-1!==t.indexOf("Aborted")||-1!==t.indexOf("Exception"))&&statusText&&(statusText.textContent="异常: "+t)},canvas:document.getElementById("canvas"),setStatus:function(t){t&&statusText&&(statusText.textContent=t)},totalDependencies:0,monitorRunDependencies:function(t){this.totalDependencies=Math.max(this.totalDependencies,t),statusText&&(statusText.textContent=t?"加载依赖资源中 ("+(this.totalDependencies-t)+"/"+this.totalDependencies+")...":"初始化引擎...")}};window.onerror=function(t){statusDot&&(statusDot.style.backgroundColor="#f44336"),statusText&&(statusText.textContent="运行异常: "+t)}</script><script async src=ktui_studio_demo.js></script></body></html>

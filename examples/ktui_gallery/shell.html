<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KTUI Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #202020;
            color: #eef0f6;
            font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
            touch-action: none;
        }

        #ktui-stage {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        #ktui-stage canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
        }

        #ktui-loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: rgba(238, 240, 246, 0.72);
            pointer-events: none;
        }

        #ktui-loading.error {
            color: #f87171;
        }
    </style>
</head>
<body>
    <div id="ktui-stage"></div>
    <div id="ktui-loading">正在加载画板...</div>

    <script type="text/javascript">
        var loadingEl = document.getElementById('ktui-loading');
        var assetVer = '__KTUI_ASSET_VER__';

        function withVer(url) {
            if (assetVer && assetVer.indexOf('__KTUI_') !== 0 && url.indexOf('?') === -1) {
                return url + '?v=' + assetVer;
            }
            return url;
        }

        function showError(msg) {
            if (!loadingEl) return;
            loadingEl.style.display = 'flex';
            loadingEl.classList.add('error');
            loadingEl.textContent = msg;
        }

        window.onerror = function(event) {
            showError('运行异常: ' + event);
        };

        var s = document.createElement('script');
        s.src = withVer('ktui_gallery.js');
        s.async = true;
        s.onload = function() {
            if (typeof window.createKtuiApp !== 'function') {
                showError('WASM 入口 createKtuiApp 未找到');
                return;
            }
            window.createKtuiApp({
                locateFile: function(path, prefix) {
                    return withVer((prefix || '') + path);
                }
            }).then(function() {
                if (loadingEl) loadingEl.style.display = 'none';
            }).catch(function(err) {
                console.error(err);
                showError('启动失败: ' + (err && err.message ? err.message : err));
            });
        };
        s.onerror = function() {
            showError('加载 ktui_gallery.js 失败');
        };
        document.body.appendChild(s);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KerneTile Studio (KTUI Web Desktop)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 18% 22%, rgba(43, 127, 255, 0.24), transparent 46%),
                radial-gradient(circle at 82% 76%, rgba(124, 58, 237, 0.20), transparent 48%),
                radial-gradient(circle at 60% 18%, rgba(14, 165, 233, 0.14), transparent 42%),
                linear-gradient(145deg, #0d0f15 0%, #131622 52%, #0c0e14 100%);
            color: #eef0f6;
        }

        #ktui-desktop {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        .desktop-watermark {
            position: fixed;
            left: 20px;
            top: 16px;
            z-index: 1;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0.72;
        }

        .desktop-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(43, 127, 255, 0.22);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.35);
            text-transform: uppercase;
        }

        .desktop-sub {
            font-size: 12px;
            color: rgba(200, 206, 224, 0.65);
        }

        #ktui-taskbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 40px;
            z-index: 900000;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            background: rgba(18, 19, 24, 0.84);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .taskbar-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11.5px;
            color: rgba(210, 214, 228, 0.78);
            padding-right: 4px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.65);
        }

        .status-dot.loading {
            background-color: #ff9800;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.65);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.4; }
            to { opacity: 1.0; }
        }
    </style>
</head>
<body>
    <div id="ktui-desktop">
        <div class="desktop-watermark">
            <div class="desktop-title">
                KerneTile Studio
                <span class="badge">Web Desktop</span>
            </div>
            <div class="desktop-sub">无边框自绘标题栏 · 多窗口桌面环境 · 拖拽 / 缩放 / 最小化至任务栏</div>
        </div>
        <div id="ktui-taskbar">
            <div class="taskbar-status">
                <span id="status-dot" class="status-dot loading"></span>
                <span id="status-text">正在加载 WebAssembly...</span>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        var statusDot = document.getElementById('status-dot');
        var statusText = document.getElementById('status-text');

        var Module = {
            preRun: [],
            postRun: [function() {
                if (statusDot) statusDot.className = 'status-dot';
                if (statusText) statusText.textContent = '运行中 · 60 FPS';
            }],
            print: function(text) {
                console.log('[KerneTile Wasm stdout]', text);
            },
            printErr: function(text) {
                console.error('[KerneTile Wasm stderr]', text);
                if (text && (text.indexOf('Aborted') !== -1 || text.indexOf('Exception') !== -1) && statusText) {
                    statusText.textContent = '异常: ' + text;
                }
            },
            setStatus: function(text) {
                if (!text) return;
                if (statusText) statusText.textContent = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                if (statusText) {
                    statusText.textContent = left ? '加载依赖 (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')...' : '初始化引擎...';
                }
            }
        };

        window.onerror = function(event) {
            if (statusDot) statusDot.style.backgroundColor = '#f44336';
            if (statusText) statusText.textContent = '运行异常: ' + event;
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
